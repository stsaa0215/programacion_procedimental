<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Usuarios</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
  </head>
  <body class="has-background-black" style="min-height: 100vh">
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <a class="navbar-item" href="../index.html"> Chechos Food </a>
      </div>

      <div id="navbarBasicExample" class="navbar-menu">
        <div class="navbar-start">
          <a class="navbar-item" href="../index.html"> Home </a>
          <a class="navbar-item"> Documentation </a>
          <div class="navbar-item has-dropdown is-hoverable">
            <a class="navbar-link"> More </a>
            <div class="navbar-dropdown">
              <a class="navbar-item"> About </a>
              <a class="navbar-item"> Jobs </a>
              <a class="navbar-item"> Contact </a>
              <hr class="navbar-divider" />
              <a class="navbar-item"> Report an issue </a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <section class="section">
      <div class="container">
        <div
          class="box"
          style="
            max-width: 650px;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
          "
        >
          <h1 class="title has-text-centered is-3 mb-5">
            Registro de Usuarios
          </h1>

          <form id="registroUsuario">
            <div class="columns">
              <div class="column">
                <div class="field">
                  <label class="label">Nombre</label>
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      placeholder="Ingresa nombre"
                      id="nombre"
                    />
                  </div>
                </div>
              </div>
              <div class="column">
                <div class="field">
                  <label class="label">Apellido</label>
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      placeholder="Ingresa apellido"
                      id="apellido"
                    />
                  </div>
                </div>
              </div>
            </div>

            <div class="columns">
              <div class="column">
                <div class="field">
                  <label class="label">Tipo de documento</label>
                  <div class="control">
                    <div class="select is-fullwidth">
                      <select id="tipoDocumento">
                        <option>Cédula</option>
                        <option>Tarjeta de identidad</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
              <div class="column">
                <div class="field">
                  <label class="label">Número de documento</label>
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      placeholder="Número de documento"
                      id="numeroDocumento"
                    />
                  </div>
                </div>
              </div>
            </div>

            <div class="columns">
              <div class="column">
                <div class="field">
                  <label class="label">Teléfono</label>
                  <div class="control">
                    <input
                      class="input"
                      type="tel"
                      placeholder="Número telefónico"
                      id="telefono"
                    />
                  </div>
                </div>
              </div>
              <div class="column">
                <div class="field">
                  <label class="label">Correo</label>
                  <div class="control">
                    <input
                      class="input"
                      type="email"
                      placeholder="ejemplo@correo.com"
                      id="correo"
                    />
                  </div>
                </div>
              </div>
            </div>

            <div class="columns">
              <div class="column">
                <div class="field">
                  <label class="label">Género</label>
                  <div class="control mt-2">
                    <label class="radio mr-4">
                      <input type="radio" name="g" id="generoMasculino" /> Masculino
                    </label>
                    <label class="radio">
                      <input type="radio" name="g" id="generoFemenino" /> Femenino
                    </label>
                  </div>
                </div>
              </div>
              <div class="column">
                <div class="field">
                  <label class="label">Fecha de nacimiento</label>
                  <div class="control">
                    <input class="input" type="date" id="fechaNacimiento" />
                  </div>
                </div>
              </div>
            </div>

            <div class="columns">
              <div class="column">
                <div class="field">
                  <label class="label">Cargo</label>
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      placeholder="Cargo que ocupa"
                      id="cargo"
                    />
                  </div>
                </div>
              </div>
              <div class="column">
                <div class="field">
                  <label class="label">Contraseña</label>
                  <div class="control">
                    <input
                      class="input"
                      type="password"
                      placeholder="********"
                      id="contrasena"
                    />
                  </div>
                </div>
              </div>
            </div>

            <div class="field mt-5">
              <div class="control">
                <button class="button is-link is-fullwidth is-medium">
                  Registrar
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>
    <script>
      document.getElementById("registroUsuario").addEventListener("submit", (e) => {
        e.preventDefault();
        const nombreVal = document.getElementById("nombre").value;
        const apellidoVal = document.getElementById("apellido").value;
        const numeroDocumentoVal = document.getElementById("numeroDocumento").value;
        const telefonoVal = document.getElementById("telefono").value;
        const correoVal = document.getElementById("correo").value;

        validarDatos(
          nombreVal,
          apellidoVal,
          numeroDocumentoVal,
          telefonoVal,
          correoVal
        );
      });
    </script>
    <script src="../../js/usuario.js"></script>
  </body>
</html>
